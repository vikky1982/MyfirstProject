<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Quest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23f0b429'/%3E%3Ccircle cx='22' cy='32' r='9' fill='%23fffdf8'/%3E%3Ccircle cx='42' cy='32' r='9' fill='%23fffdf8'/%3E%3Ccircle cx='23' cy='33' r='3.2' fill='%23243022'/%3E%3Ccircle cx='43' cy='33' r='3.2' fill='%23243022'/%3E%3Cpath d='M29 43h6l-3 6z' fill='%23e36a45'/%3E%3C/svg%3E">
  <style>
:root {
  --ink: #243022;
  --muted: #5d6b59;
  --paper: #f4f1e4;
  --card: #fffdf8;
  --line: #e3dcc4;
  --leaf: #2f7d4a;
  --leaf-dark: #1d5c34;
  --sun: #f0b429;
  --coral: #e36a45;
  --sky: #d9eef8;
  --shadow: 0 16px 40px rgba(70, 55, 20, 0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font-family: "Trebuchet MS", "Segoe UI", sans-serif;
  font-size: 1.125rem;
  line-height: 1.45;
  background:
    radial-gradient(circle at 8% -10%, #fff4c8 0, transparent 36%),
    radial-gradient(circle at 110% 0, #d7f0dc 0, transparent 32%),
    var(--paper);
}

button, input { font: inherit; }
button { cursor: pointer; }
a { color: var(--leaf-dark); }

.skip {
  position: absolute;
  left: 1rem;
  top: -4rem;
  background: var(--ink);
  color: white;
  padding: 0.5rem 0.8rem;
}

.skip:focus { top: 0.5rem; }

.top, main, .foot {
  max-width: 920px;
  margin: 0 auto;
  padding-left: 1.25rem;
  padding-right: 1.25rem;
}

.top {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  flex-wrap: wrap;
  padding-top: 1rem;
}

.brand, .nav button, .linkish {
  background: none;
  border: 0;
  color: var(--ink);
  font-weight: 800;
}

.brand { display: flex; align-items: center; gap: 0.55rem; font-size: 1.25rem; padding: 0; }
.owl { width: 46px; height: 46px; }
.nav { display: flex; gap: 0.4rem; }
.nav button {
  background: rgba(255, 255, 255, 0.7);
  border-radius: 999px;
  padding: 0.35rem 0.8rem;
}

.timer {
  margin-left: auto;
  min-width: 148px;
  background: var(--card);
  border-radius: 18px;
  padding: 0.45rem 0.7rem 0.55rem;
  box-shadow: var(--shadow);
}
.timer-top { display: flex; justify-content: space-between; font-weight: 800; }
.track { margin-top: 0.35rem; height: 8px; background: #efe7d2; border-radius: 999px; overflow: hidden; }
.bar { height: 100%; width: 100%; background: var(--leaf); }
.timer.is-low strong, .timer.is-low .bar { color: var(--coral); }
.timer.is-low .bar { background: var(--coral); }

main { padding-top: 1rem; padding-bottom: 2rem; }

.card, .hero-card, .word-card {
  background: var(--card);
  border-radius: 28px;
  box-shadow: var(--shadow);
  padding: 1.3rem;
  margin: 0 0 1rem;
}

h1, h2, h3 { line-height: 1.15; margin: 0.2rem 0 0.6rem; }
h1 { font-size: clamp(2rem, 5vw, 3.1rem); }
.word { font-size: clamp(2.7rem, 8vw, 4.6rem); letter-spacing: -0.04em; margin: 0.2rem 0; }
.kicker { margin: 0; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; font-size: 0.82rem; color: var(--leaf-dark); }
.lead, .muted { color: var(--muted); }
.streak { font-weight: 800; }

.primary, .secondary, .choice, .hear {
  border: 0;
  border-radius: 999px;
  font-weight: 800;
}
.primary, .secondary { display: inline-flex; padding: 0.85rem 1.3rem; text-decoration: none; }
.primary { background: var(--leaf); color: white; }
.secondary { background: var(--sky); color: var(--ink); }
.hear { background: var(--sun); padding: 0.45rem 0.9rem; }

.stack { display: grid; gap: 0.55rem; }
.stack label { font-weight: 800; }
input[type="text"], input[type="search"], input:not([type]) {
  width: 100%;
  padding: 0.8rem 0.9rem;
  border-radius: 16px;
  border: 2px solid var(--line);
}

.choices { display: grid; gap: 0.65rem; }
.choice {
  text-align: left;
  background: white;
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 0.9rem 1rem;
}
.choice:hover, .choice:focus-visible { border-color: var(--leaf); background: #f3fbf5; }
.choice.shake { animation: shake 0.35s linear; }

.banner { border-radius: 16px; padding: 0.75rem 0.9rem; font-weight: 800; }
.banner.good { background: #e5f7ea; }
.banner.level { background: #fff1c9; }
.banner.bad { background: #ffe4dc; }

.dots { list-style: none; display: flex; gap: 0.45rem; padding: 0; margin: 0 0 1rem; flex-wrap: wrap; }
.dots li {
  width: 2.1rem; height: 2.1rem; border-radius: 50%;
  display: grid; place-items: center; font-weight: 800; background: #efe6cf;
}
.dots li.done { background: var(--leaf); color: white; }
.dots li.now { background: var(--sun); }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; margin-bottom: 1rem; }
.stat-row article { background: var(--card); border-radius: 22px; padding: 0.9rem; box-shadow: var(--shadow); }
.stat-row strong { display: block; font-size: 1.8rem; }
.stat-row span { color: var(--muted); font-weight: 700; }

.path { list-style: none; padding: 0; margin: 0.6rem 0 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; }
.path li { border: 2px dashed var(--line); border-radius: 18px; padding: 0.7rem; background: #fffaf0; }
.path li.current { border-style: solid; border-color: var(--leaf); background: #f1fbf4; }
.path li.locked { opacity: 0.55; }
.path b, .path span { display: block; }
.path span { color: var(--muted); }

.pips { display: flex; gap: 0.3rem; }
.pips i { width: 0.85rem; height: 0.85rem; border-radius: 50%; background: #eadfbe; display: block; }
.pips i.on { background: var(--leaf); }
.pron { margin: 0.2rem 0; font-weight: 800; color: var(--muted); }
blockquote, .example { margin: 1rem 0; padding: 0.8rem 1rem; background: var(--sky); border-radius: 18px; }
.peek summary { cursor: pointer; font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; padding: 0; list-style: none; }
.chips li, .chips button { background: #f6f0df; border-radius: 999px; padding: 0.25rem 0.7rem; font-weight: 800; border: 0; }
.review { border-top: 1px solid var(--line); padding: 0.7rem 0; }
.review summary { cursor: pointer; font-weight: 800; font-size: 1.25rem; }
.result { margin: 0.7rem 0; border-radius: 16px; padding: 0.8rem 1rem; }
.result.ok { background: #f3faf4; }
.result.miss { background: #fff7f4; }
.foot { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; color: var(--muted); padding-bottom: 2rem; }
.linkish { color: var(--leaf-dark); text-decoration: underline; padding: 0; }

.sparkle-layer { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.spark {
  position: fixed;
  font-size: 1.15rem;
  animation: burst 720ms ease-out forwards;
}
@keyframes burst {
  to { transform: translate(var(--dx), var(--dy)) scale(0.4) rotate(140deg); opacity: 0; }
}
.spark { font-size: 1.6rem; }
.sparkie-count {
  margin-left: auto;
  background: #fff4c2;
  color: #8a5a00;
  font-weight: 800;
  border-radius: 999px;
  padding: 0.45rem 0.8rem;
  box-shadow: var(--shadow);
  border: 3px solid #e36a45;
}
.timer { margin-left: 0; }
.sparkie-count.pop { animation: pop 0.45s ease; }
.sparkie-pop {
  position: fixed;
  font-weight: 800;
  font-size: 1.6rem;
  color: #e36a45;
  transform: translate(-50%, -50%);
  animation: floatup 1s ease-out forwards;
}
@keyframes pop {
  40% { transform: scale(1.25); }
}
@keyframes floatup {
  to { transform: translate(-50%, -80px); opacity: 0; }
}
@keyframes shake {
  20% { transform: translateX(-6px); }
  40% { transform: translateX(6px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(4px); }
}

@media (max-width: 700px) {
  .stat-row, .path { grid-template-columns: 1fr; }
  .timer { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .spark, .choice.shake { animation: none; }
}

</style></head>

  <main id="app"></main>

ctive","pronunciation":"yoo-NEEK","meaning":"One of a kind; nothing else is exactly like it.","tip":"Think: unlike any other.","example":"Your fingerprint is unique.","level":3,"sequence":6},{"text":"humble","part_of_speech":"adjective","pronunciation":"HUM-bul","meaning":"Not showing off, even if you are good at something.","tip":"Think: modest.","example":"The humble captain thanked the whole team for the win.","level":3,"sequence":7},{"text":"genuine","part_of_speech":"adjective","pronunciation":"JEN-yoo-in","meaning":"Real and sincere, not fake.","tip":"Think: sincere.","example":"She gave a genuine apology and helped clean up.","level":3,"sequence":8},{"text":"persuade","part_of_speech":"verb","pronunciation":"per-SWAYD","meaning":"To give reasons that convince someone.","tip":"Think: convince.","example":"Can you persuade the group to try your game idea?","level":3,"sequence":9},{"text":"tactic","part_of_speech":"noun","pronunciation":"TAK-tik","meaning":"A planned way of reaching a goal.","tip":"Think: a strategy.","example":"Passing to the open player was a smart tactic.","level":3,"sequence":10},{"text":"ambitious","part_of_speech":"adjective","pronunciation":"am-BISH-us","meaning":"Wanting to reach a big goal.","tip":"Think: reaching high.","example":"The ambitious project was a model of the whole town.","level":3,"sequence":11},{"text":"diligent","part_of_speech":"adjective","pronunciation":"DIL-ih-junt","meaning":"Working carefully and steadily.","tip":"Think: hardworking.","example":"Diligent practice turned the wobbly song into music.","level":3,"sequence":12},{"text":"optimistic","part_of_speech":"adjective","pronunciation":"op-tuh-MIS-tik","meaning":"Expecting things to turn out well.","tip":"Think: hopeful.","example":"Even after the rain delay, the coach stayed optimistic.","level":3,"sequence":13},{"text":"compassionate","part_of_speech":"adjective","pronunciation":"kum-PASH-uh-nit","meaning":"Caring when someone else is hurting.","tip":"Think: kindhearted.","example":"A compassionate classmate sat with the new student at lunch.","level":3,"sequence":14},{"text":"anticipate","part_of_speech":"verb","pronunciation":"an-TISS-ih-payt","meaning":"To expect something and get ready for it.","tip":"Think: prepare for.","example":"We anticipate a big crowd, so we set extra chairs.","level":3,"sequence":15},{"text":"contradict","part_of_speech":"verb","pronunciation":"kon-truh-DIKT","meaning":"To say the opposite of what someone else said.","tip":"Think: disagree with.","example":"Please do not contradict the safety rule about helmets.","level":3,"sequence":16},{"text":"justify","part_of_speech":"verb","pronunciation":"JUS-tuh-fy","meaning":"To give a good reason for something.","tip":"Think: defend with a reason.","example":"How can you justify spending all your allowance on stickers?","level":3,"sequence":17},{"text":"solemn","part_of_speech":"adjective","pronunciation":"SOL-um","meaning":"Very serious and quiet.","tip":"Think: grave.","example":"The hall was solemn during the moment of silence.","level":3,"sequence":18},{"text":"resent","part_of_speech":"verb","pronunciation":"rih-ZENT","meaning":"To feel upset that something is unfair.","tip":"Think: feel bitter about.","example":"I resent doing every chore while my brother plays.","level":3,"sequence":19},{"text":"versatile","part_of_speech":"adjective","pronunciation":"VUR-suh-til","meaning":"Able to do many different things well.","tip":"Think: flexible.","example":"A versatile player can defend and shoot.","level":3,"sequence":20},{"text":"elaborate","part_of_speech":"adjective","pronunciation":"ih-LAB-uh-rit","meaning":"Having lots of careful details.","tip":"Think: detailed.","example":"The elaborate costume had lights sewn into the cape.","level":3,"sequence":21},{"text":"illuminate","part_of_speech":"verb","pronunciation":"ih-LOO-mih-nayt","meaning":"To light something up, or to make an idea clear.","tip":"Think: light up.","example":"Lanterns illuminate sequence":30},{"text":"clarify","part_of_speech":"verb","pronunciation":"KLAIR-ih-fy","meaning":"To make something easier to understand.","tip":"Think: make clear.","example":"Can you clarify which page we should read?","level":4,"sequence":1},{"text":"abrupt","part_of_speech":"adjective","pronunciation":"uh-BRUPT","meaning":"Sudden and unexpected.","tip":"Think: sudden.","example":"The song came to an abrupt stop when the power blinked.","level":4,"sequence":2},{"text":"convey","part_of_speech":"verb","pronunciation":"kun-VAY","meaning":"To communicate an idea or feeling.","tip":"Think: get across.","example":"Her smile helped convey that she was proud, not angry.","level":4,"sequence":3},{"text":"emphasize","part_of_speech":"verb","pronunciation":"EM-fuh-size","meaning":"To show that something is especially important.","tip":"Think: stress.","example":"The teacher will emphasize the safety steps before the lab.","level":4,"sequence":4},{"text":"feasible","part_of_speech":"adjective","pronunciation":"FEE-zih-bul","meaning":"Possible to do with the time and tools you have.","tip":"Think: doable.","example":"Building a small robot in a week is feasible if we share jobs.","level":4,"sequence":5},{"text":"relevant","part_of_speech":"adjective","pronunciation":"REL-uh-vunt","meaning":"Connected to the topic that matters right now.","tip":"Think: to the point.","example":"Please keep your example relevant to the question.","level":4,"sequence":6},{"text":"significant","part_of_speech":"adjective","pronunciation":"sig-NIF-ih-kunt","meaning":"Important enough to matter.","tip":"Think: major.","example":"A significant change in the plan means we start over.","level":4,"sequence":7},{"text":"perspective","part_of_speech":"noun","pronunciation":"per-SPEK-tiv","meaning":"A way of looking at something.","tip":"Think: point of view.","example":"From the baby's perspective, the chair is a mountain.","level":4,"sequence":8},{"text":"concise","part_of_speech":"adjective","pronunciation":"kun-SISE","meaning":"Saying what you mean in just a few words.","tip":"Think: brief and clear.","example":"A concise answer can be better than a long one.","level":4,"sequence":9},{"text":"coherent","part_of_speech":"adjective","pronunciation":"koh-HEER-unt","meaning":"Clear and connected from start to finish.","tip":"Think: logical.","example":"Her coherent speech moved from problem to plan to result.","level":4,"sequence":10},{"text":"credible","part_of_speech":"adjective","pronunciation":"KRED-ih-bul","meaning":"Believable and trustworthy.","tip":"Think: believable.","example":"A credible report names where the facts came from.","level":4,"sequence":11},{"text":"articulate","part_of_speech":"adjective","pronunciation":"ar-TIK-yuh-lit","meaning":"Able to explain ideas clearly.","tip":"Think: well-spoken.","example":"An articulate guide made the museum easy to follow.","level":4,"sequence":12},{"text":"analogy","part_of_speech":"noun","pronunciation":"uh-NAL-uh-jee","meaning":"A comparison that helps explain an idea.","tip":"Think: a comparison.","example":"The teacher used an analogy between the heart and a pump.","level":4,"sequence":13},{"text":"imply","part_of_speech":"verb","pronunciation":"im-PLY","meaning":"To suggest something without saying it directly.","tip":"Think: hint.","example":"Dark clouds imply that we should bring jackets.","level":4,"sequence":14},{"text":"deduce","part_of_speech":"verb","pronunciation":"dih-DOOS","meaning":"To figure something out from clues.","tip":"Think: conclude.","example":"From the muddy cleats, we can deduce who played outside.","level":4,"sequence":15},{"text":"hypothesis","part_of_speech":"noun","pronunciation":"hy-POTH-uh-sis","meaning":"A careful guess you can test.","tip":"Think: a testable idea.","example":"My hypothesis is that plants grow faster in the sunny window.","level":4,"sequence":16},{"text":"objective","part_of_speech":"adjective","pronunciation":"ub-JEK-tiv","meaning":"Based on facts, not personal feelings.","tip":"Think: fair and factual.","example":"A good referee is objective and does not favor one team.","level":4,"sequence":17},{"text":"tentative","part_of_speech":"adjective","pronunciation":"TEN-tuh-tiv","meaning":"Not final; still unsure.","tip":"Think: provisional.","example":"We made a tentative plan in case the rain stops.","level":4,"sequence":18},{"text":"subtle","part_of_speech":"adjective","pronunciation":"SUT-ul","meaning":"Not obvious; you notice it only if you look closely.","tip":"Think: understated.","example":"There is a subtle difference between the two shades of blue.","level":4,"sequence":19},{"text":"speculate","part_of_speech":"verb","pronunciation":"SPEK-yuh-layt","meaning":"To guess without having all the facts.","tip":"Think: guess.","example":"Do not speculate about the ending until you finish the book.","level":4,"sequence":20},{"text":"inevitable","part_of_speech":"adjective","pronunciation":"in-EV-ih-tuh-bul","meaning":"Sure to happen; it cannot be avoided.","tip":"Think: unavoidable.","example":"If you never charge the tablet, a dead battery is inevitable.","level":4,"sequence":21},{"text":"intricate","part_of_speech":"adjective","pronunciation":"IN-trih-kit","meaning":"Full of many small, connected parts.","tip":"Think: complex.","example":"The intricate knot took patience to untie.","level":4,"sequence":22},{"text":"negotiate","part_of_speech":"verb","pronunciation":"nih-GOH-shee-ayt","meaning":"To talk until both sides can agree.","tip":"Think: work out a deal.","example":"The siblings negotiate who washes dishes and who dries.","level":4,"sequence":23},{"text":"ambiguous","part_of_speech":"adjective","pronunciation":"am-BIG-yoo-us","meaning":"Unclear because it could mean more than one thing.","tip":"Think: unclear.","example":"The note was ambiguous, so nobody knew which field to use.","level":4,"sequence":24},{"text":"advocate","part_of_speech":"verb","pronunciation":"AD-vuh-kayt","meaning":"To speak up in support of a ","part_of_speech":"verb","pronunciation":"dih-PIKT","meaning":"To show or describe something in a picture or story.","tip":"Think: portray.","example":"The mural will depict kids planting trees.","level":5,"sequence":4},{"text":"conventional","part_of_speech":"adjective","pronunciation":"kun-VEN-shuh-nul","meaning":"Following the usual way of doing something.","tip":"Think: traditional.","example":"A conventional sandwich uses bread, but wraps are fun too.","level":5,"sequence":5},{"text":"comprehensive","part_of_speech":"adjective","pronunciation":"kom-prih-HEN-siv","meaning":"Including nearly everything important.","tip":"Think: complete.","example":"The comprehensive checklist named every supply for camp.","level":5,"sequence":6},{"text":"dilemma","part_of_speech":"noun","pronunciation":"dih-LEM-uh","meaning":"A choice between two difficult options.","tip":"Think: a tough choice.","example":"Sharing one ticket was a dilemma for the two friends.","level":5,"sequence":7},{"text":"deter","part_of_speech":"verb","pronunciation":"dih-TUR","meaning":"To discourage someone from doing something.","tip":"Think: discourage.","example":"A loud alarm can deter a raccoon from the trash bin.","level":5,"sequence":8},{"text":"eloquent","part_of_speech":"adjective","pronunciation":"EL-uh-kwunt","meaning":"Speaking in a clear, beautiful, and persuasive way.","tip":"Think: gracefully persuasive.","example":"Her eloquent speech changed the vote.","level":5,"sequence":9},{"text":"enduring","part_of_speech":"adjective","pronunciation":"en-DOOR-ing","meaning":"Lasting for a long time.","tip":"Think: long-lasting.","example":"Their enduring friendship started in kindergarten.","level":5,"sequence":10},{"text":"abstract","part_of_speech":"adjective","pronunciation":"AB-strakt","meaning":"About ideas, not physical things you can touch.","tip":"Think: not concrete.","example":"Fairness is an abstract idea, but you can see it in a fair game.","level":5,"sequence":11},{"text":"adept","part_of_speech":"adjective","pronunciation":"uh-DEPT","meaning":"Very skilled at something.","tip":"Think: expert.","example":"She is adept at solving the cube in under a minute.","level":5,"sequence":12},{"text":"benevolent","part_of_speech":"adjective","pronunciation":"buh-NEV-uh-lunt","meaning":"Wanting to do good for others.","tip":"Think: kindly.","example":"A benevolent neighbor shovels the sidewalk for everyone.","level":5,"sequence":13},{"text":"candid","part_of_speech":"adjective","pronunciation":"KAN-did","meaning":"Honest and open, even when it is uncomfortable.","tip":"Think: frank.","example":"Give me your candid opinion of the story's ending.","level":5,"sequence":14},{"text":"concur","part_of_speech":"verb","pronunciation":"kun-KUR","meaning":"To agree.","tip":"Think: agree.","example":"The judges concur that both projects deserve a ribbon.","level":5,"sequence":15},{"text":"contemplate","part_of_speech":"verb","pronunciation":"KON-tem-playt","meaning":"To think about something deeply.","tip":"Think: ponder.","example":"I contemplate my move before I touch a chess piece.","level":5,"sequence":16},{"text":"criterion","part_of_speech":"noun","pronunciation":"kry-TEER-ee-un","meaning":"A standard you use to judge something.","tip":"Think: a standard.","example":"One criterion for the poster contest is neat lettering.","level":5,"sequence":17},{"text":"deficient","part_of_speech":"adjective","pronunciation":"dih-FISH-unt","meaning":"Missing something that is needed.","tip":"Think: lacking.","example":"A lunch with no protein is deficient for a long practice.","level":5,"sequence":18},{"text":"discreet","part_of_speech":"adjective","pronunciation":"dih-SKEET","meaning":"Careful not to attract attention or embarrass someone.","tip":"Think: tactful. Not the same as discrete.","example":"Be discreet if you remind a friend about a zipper.","level":5,"sequence":19},{"text":"anomaly","part_of_speech":"noun","pronunciation":"uh-NOM-uh-lee","meaning":"Something that does not fit the usual pattern.","tip":"Think: an odd exception.","example":"Snow in June would be an anomaly here.","level":5,"sequence":20},{"text":"apprehensive","part_of_speech":"adjective","pronunciation":"ap-rih-HEN-siv","meaning":"Nervous about what might happen.","tip":"Think: uneasy.","example":"I feel apprehensive before the spelling bee, then I breathe.","level":5,"sequence":21},{"text":"arbitrary","part_of_speech":"adjective","pronunciation":"AR-bih-trair-ee","meaning":"Chosen for no clear reason.","tip":"Think: random.","example":"The rule felt arbitrary because nobody could explain it.","level":5,"sequence":22},{"text":"alleviate","part_of_speech":"verb","pronunciation":"uh-LEE-vee-ayt","meaning":"To make pain or trouble less severe.","tip":"Think: ease.","example":"A cold cloth can alleviate a headache.","level":5,"sequence":23},{"text":"adversity","part_of_speech":"noun","pronunciation":"ad-VER-sih-tee","meaning":"A hard time or serious difficulty.","tip":"Think: hardship.","example":"The team showed heart during adversity, even after two losses.","level":5,"sequence":24},{"text":"aesthetic","part_of_speech":"adjective","pronunciation":"es-THET-ik","meaning":"Related to beauty and how things look.","tip":"Think: artistic.","example":"The poster has a strong aesthetic of bright shapes.","level":5,"sequence":25},{"text":"complacent","part_of_speech":"adjective","pronunciation":"kum-PLAY-sunt","meaning":"Too satisfied, so you stop trying to improve.","tip":"Think: smug and stuck.","example":"Do not get complacent after one good grade.","level":5,"sequence":26},{"text":"empirical","part_of_speech":"adjective","pronunciation":"em-PEER-ih-kul","meaning":"Based on what you can observe or test.","tip":"Think: from evidence.","example":"We need empirical results, not just a guess.","level":5,"sequence":27},{"text":"ephemeral","part_of_speech":"adjective","pronunciation":"ih-FEM-er-ul","meaning":"Lasting for only a short time.","tip":"Think: fleeting.","example   }

  function dots(items, current) {
    return '<ol class="dots">' + items.map(function (item, index) {
      var cls = item.learned ? "done" : (current && item.word.text === current.text ? "now" : "");
      return '<li class="' + cls + '">' + (index + 1) + "</li>";
    }).join("") + "</ol>";
  }

  function banner() {
    if (!note) return "";
    var kind = note.kind || "good";
    return '<p class="banner ' + kind + '">' + esc(note.text) + "</p>";
  }

  function homeHtml() {
    var day = today();
    var items = quest.board(state, words, day);
    var current = quest.currentWord(state, words, day);
    var mode = quest.screen(state, words, day);
    var level = levelMeta(currentLevelNumber());
    var title = "Ten words are waiting.";
    var body = "<p>Today's level: " + level.emoji + " " + esc(level.name) + ". " + esc(level.blurb) + "</p>" +
      dots(items, current) +
      '<button class="primary" type="button" data-go="learn">' + (items.some(function (item) { return item.learned; }) ? "Continue today's words" : "Start today's words") + "</button>";
    if (mode === "quiz") {
      title = "Quiz time.";
      body = "<p>You have learned " + state.learned.length + " words. Show what you remember with 10 questions.</p>" +
        '<button class="primary" type="button" data-go="quiz">Start the quiz</button>';
    } else if (mode === "done") {
      title = "Ten words done.";
      body = "<p>Keep going. The next ten are ready, and they get harder as you climb.</p>" +
        '<button class="primary" type="button" data-go="keep">Keep playing</button>' +
        '<button class="secondary" type="button" data-go="review">Review what you know</button>';
    } else if (mode === "champion") {
      title = "You learned the whole path.";
      body = "<p>Sparkies stay with you. The words start again, from the friendly ones.</p>" +
        '<button class="primary" type="button" data-go="keep">Play again</button>';
    }
    var learned = state.learned.length;
    var into = learned % quest.QUIZ_EVERY;
    var until = quest.quizDue(state) ? 0 : (into === 0 ? quest.QUIZ_EVERY : quest.QUIZ_EVERY - into);
    var shownStreak = (function () {
      var message = quest.streakMessage(state, day);
      var found = message.match(/(\d+)-day/);
      return found ? found[1] : "0";
    })();
    var here = currentLevelNumber();
    var path = "";
    for (var levelNo = 1; levelNo <= 6; levelNo++) {
      var meta = levelMeta(levelNo);
      var count = state.learned.filter(function (item) {
        return words.some(function (word) { return word.text === item.text && word.level === levelNo; });
      }).length;
      var cls = count >= 30 ? "done" : (levelNo === here ? "current" : (levelNo > here ? "locked" : "done"));
      path += '<li class="' + cls + '"><b>' + meta.emoji + " " + esc(meta.name) + "</b><span>" + count + "/30</span></li>";
    }
    return '<section class="hero-card"><p class="kicker">Hi, ' + esc(state.name) + "</p><h1>" + title + "</h1><p class=\"streak\">" +
      esc(quest.streakMessage(state, day)) + "</p>" + banner() + '<div class="mission">' + body + "</div></section>" +
      '<section class="stat-row"><article><strong>' + learned + '</strong><span>words learned</span></article><article><strong>' +
      until + "</strong><span>" + (until ? "words until a quiz" : "quiz is ready") + "</span></article><article><strong>" +
      shownStreak + '</strong><span>day streak</span></article></section>' +
      '<section class="card"><h2>Your path gets harder</h2><p class="muted">Each level is tougher than the one before.</p><ol class="path">' + path + "</ol></section>";
  }

  function learnHtml() {
    var day = today();
    if (quest.screen(state, words, day) === "quiz") return quizHtml();
    var items = quest.board(state, words, day);
    var word = quest.currentWord(state, words, day);
    if (!word) return homeHtml();
    var meta = levelMeta(word.level);
    var options = quest.choicesFor(state, word, words, decoys, day);
    var pips = "";
    for (var i = 1; i <= 6; i++) pips += '<i class="' + (i <= word.level ? "on" : "") + '"></i>';
    return banner() + dots(items, word) +
      '<article class="word-card"><p class="kicker">Level ' + word.level + " of 6 · " + esc(meta.name) + "</p>" +
      '<p class="pips" aria-label="Difficulty ' + word.level + ' of 6">' + pips + "</p>" +
      '<h1 class="word">' + esc(word.text) + "</h1>" +
      '<p class="pron">' + esc(word.pronunciation) + " · " + esc(word.part_of_speech) + "</p>" +
      '<button class="hear" type="button" data-speak="' + esc(word.text + ". " + word.example) + '">Hear it</button>' +
      "<blockquote>" + esc(word.example) + "</blockquote>" +
      '<details class="peek"' + (wrong ? " open" : "") + "><summary>Need a peek at the meaning?</summary><p>" +
      esc(word.meaning) + "</p><p><b>" + esc(word.tip) + "</b></p></details></article>" +
      '<form class="stack" data-answer="learn"><h2>What does it mean?</h2><div class="choices">' +
      options.map(function (choice) {
        return '<button class="choice" type="submit" name="choice" value="' + esc(choice) + '">' + esc(choice) + "</button>";
      }).join("") + "</div></form>";
  }

  function quizHtml() {
    var quiz = quest.startQuiz(state, words);
    save();
    if (!quiz) return homeHtml();
    var question = null;
    var index = 0;
    quiz.questions.forEach(function (item, i) {
      if (!question && !item.selected) {
        question = item;
        index = i;
      }
    });
    if (!question) return resultHtml();
    var word = words.filter(function (item) { return item.text === question.text; })[0];
    var marks = quiz.questions.map(function (item, i) {
      var cls = item.selected ? "done" : (i === index ? "now" : "");
      return '<li class="' + cls + '">' + (i + 1) + "</li>";
    }).join("");
    return banner() + '<p class="kicker">Question ' + (index + 1) + " of " + quiz.questions.length + "</p><ol class=\"dots\">" + marks + "</ol>" +
      '<article class="word-card"><h1 class="word">' + esc(word.text) + "</h1><p class=\"pron\">" + esc(word.pronunciation) +
      " · " + esc(word.part_of_speech) + '</p><button class="hear" type="button" data-speak="' + esc(word.text) +
      '">Hear it</button><p class="streak">What does this word mean?</p></article>' +
      '<form class="stack" data-answer="quiz" data-index="' + index + '"><div class="choices">' +
      question.choices.map(function (choice) {
        return '<button class="choice" type="submit" value="' + esc(choice) + '">' + esc(choice) + "</button>";
      }).join("") + "</div></form>";
  }

  function resultHtml() {
    var quiz = state.quiz;
    if (!quiz) return homeHtml();
    var score = quiz.score || 0;
    var total = quiz.questions.length;
    var lead = score === total ? "Perfect. Olive is doing a happy spin." :
      score >= 8 ? "Wonderful. Those words really stuck." :
      score >= 6 ? "Good work. A little more practice and they will stick." :
      "Brave try. Let's look at the tricky ones together.";
    var details = quiz.questions.map(function (question) {
      var word = words.filter(function (item) { return item.text === question.text; })[0];
      var ok = question.selected === question.correct;
      if (ok) return '<details class="result ok"><summary>' + esc(word.text) + " — correct</summary><p>" + esc(word.meaning) + "</p></details>";
      return '<article class="result miss"><h3>' + esc(word.text) + "</h3><p><b>Meaning:</b> " + esc(question.correct) +
        "</p><p class=\"muted\">You picked: " + esc(question.selected) + "</p><p class=\"example\">" + esc(word.example) + "</p></article>";
    }).join("");
    return '<section class="hero-card"><p class="kicker">Quiz</p><h1>' + score + " / " + total + "</h1><p class=\"lead\">" + lead +
      '</p><button class="primary" type="button" data-go="finish-quiz">Back to today</button></section><section class="card"><h2>Let\'s check the answers</h2>' +
      details + "</section>";
  }

  function progressHtml() {
    var day = today();
    var here = currentLevelNumber();
    var blocks = "";
    for (var levelNo = 1; levelNo <= 6; levelNo++) {
      var meta = levelMeta(levelNo);
      var known = words.filter(function (word) {
        return word.level === levelNo && state.learned.some(function (item) { return item.text === word.text; });
      });
      var cls = known.length >= 30 ? "done" : (levelNo === here ? "current" : (levelNo > here ? "locked" : ""));
      blocks += '<article class="' + cls + '"><h3>' + meta.emoji + " " + esc(meta.name) + " · " + known.length +
        '/30</h3><div class="track"><div class="bar" style="width:' + (known.length / 30 * 100) + '%"></div></div><p>' +
        esc(meta.blurb) + "</p>" + (levelNo > here ? "<p class=\"muted\">Still ahead.</p>" :
        '<ul class="chips">' + known.map(function (word) { return "<li>" + esc(word.text) + "</li>"; }).join("") + "</ul>") + "</article>";
    }
    var quizzes = Object.keys(state.quizzes).sort(function (a, b) { return a - b; }).map(function (key) {
      var quiz = state.quizzes[key];
      return "<li>After " + key + " words: <b>" + quiz.score + "/" + quiz.total + "</b></li>";
    }).join("");
    return '<section class="hero-card"><p class="kicker">' + esc(state.name) + '\'s progress</p><h1>' + state.learned.length +
      " words learned</h1><p>" + esc(quest.streakMessage(state, day)) + "</p></section><section class=\"card\"><h2>Levels</h2>" +
      blocks + "</section><section class=\"card\"><h2>Quizzes</h2>" + (quizzes ? "<ul>" + quizzes + "</ul>" : "<p>Your first quiz unlocks after 30 words.</p>") + "</section>";
  }

  function reviewHtml() {
    if (!state.learned.length) {
      return '<section class="hero-card"><h1>Words you already know</h1><p>Learn today\'s words first.</p><button class="primary" type="button" data-go="learn">Start learning</button></section>';
    }
    var html = '<section class="hero-card"><h1>Words you already know</h1><label for="filter">Find a word</label><input id="filter" type="search" placeholder="Try brave or ancient"></section>';
    for (var levelNo = 1; levelNo <= 6; levelNo++) {
      var known = words.filter(function (word) {
        return word.level === levelNo && state.learned.some(function (item) { return item.text === word.text; });
      });
      if (!known.length) continue;
      var meta = levelMeta(levelNo);
      html += '<section class="card"><h2>' + meta.emoji + " " + esc(meta.name) + "</h2>" + known.map(function (word) {
        return '<details class="review" data-word="' + esc(word.text.toLowerCase()) + '" data-meaning="' + esc(word.meaning.toLowerCase()) +
          '"><summary>' + esc(word.text) + "</summary><p class=\"pron\">" + esc(word.pronunciation) + "</p><p>" + esc(word.meaning) +
          "</p><p class=\"example\">" + esc(word.example) + '</p><button class="hear" type="button" data-speak="' +
          esc(word.text + ". " + word.meaning) + '">Hear it</button></details>';
      }).join("") + "</section>";
    }
    return html;
  }

  function welcomeHtml() {
    return '<section class="hero-card"><p class="kicker">Olive the owl says hello</p><h1>Ten new words at a time.</h1>' +
      '<p class="lead">Every correct answer gives a sparkie. Words start friendly and get harder. Keep playing as long as you like. Progress stays on this computer.</p>' +
      (note ? banner() : "") +
      '<form class="stack" data-answer="welcome"><label for="name">What should Olive call you?</label>' +
      '<input id="name" name="name" maxlength="20" autocomplete="nickname" placeholder="Your name" autofocus>' +
      '<button class="primary" type="submit">Let\'s go</button></form></section>';
  }

  function draw(nextView, sparkleAt) {
    var day = today();
    if (!state.name) nextView = "welcome";
    else if (!nextView || nextView === "home" || nextView === "learn" || nextView === "quiz") {
      var mode = quest.screen(state, words, day);
      if (!nextView || nextView === "home") {
        if (mode === "result") nextView = "result";
        else nextView = "home";
      } else if (nextView === "learn" && (mode === "quiz" || mode === "result" || mode === "done" || mode === "champion")) {
        nextView = mode === "quiz" ? "quiz" : (mode === "result" ? "result" : "home");
      }
    }
    view = nextView;
    var html = view === "welcome" ? welcomeHtml() :
      view === "learn" ? learnHtml() :
      view === "quiz" ? quizHtml() :
      view === "result" ? resultHtml() :
      view === "progress" ? progressHtml() :
      view === "review" ? reviewHtml() : homeHtml();
    document.getElementById("app").innerHTML = html;
    renderNav(view === "welcome");
    if (sparkleAt) burst(sparkleAt.x, sparkleAt.y);
    var field = document.getElementById("name") || document.getElementById("filter");
    if (field) field.focus();
  }

  document.body.addEventListener("click", function (event) {
    var speak = event.target.closest("[data-speak]");
    if (speak && window.speechSynthesis) {
      var utterance = new SpeechSynthesisUtterance(speak.getAttribute("data-speak"));
      utterance.rate = 0.9;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }
    var go = event.target.closest("[data-go]");
    if (!go) return;
    var target = go.getAttribute("data-go");
    note = null;
    wrong = false;
    if (target === "switch") {
      state.name = "";
      save();
      draw("welcome");
      return;
    }
    if (target === "finish-quiz") {
      if (state.quiz && state.quiz.score >= 8) burst(window.innerWidth / 2, 180);
      state.quiz = null;
      quest.ensurePlan(state, words, today());
      save();
      draw("home");
      return;
    }
    if (target === "quiz") {
      quest.startQuiz(state, words);
      save();
      draw("quiz");
      return;
    }
    if (target === "keep") {
      var dayNow = today();
      quest.keepPlaying(state, words, dayNow);
      var nextMode = quest.screen(state, words, dayNow);
      if (nextMode === "quiz") {
        quest.startQuiz(state, words);
        note = { kind: "level", text: "Quiz time before the next words." };
      } else {
        note = { kind: "good", text: "Ten more words. Let's go." };
      }
      save();
      draw(nextMode === "quiz" ? "quiz" : "learn");
      return;
    }
    draw(target);
  });

  document.body.addEventListener("submit", function (event) {
    var form = event.target.closest("form");
    if (!form) return;
    event.preventDefault();
    var kind = form.getAttribute("data-answer");
    if (kind === "welcome") {
      var name = quest.cleanName(form.name.value);
      if (!name) {
        note = { kind: "bad", text: "Use a name with letters, like Maya or Jo." };
        draw("welcome");
        return;
      }
      state.name = name;
      note = { kind: "level", text: "We'll start with Seedling words. They will get harder as you grow." };
      save();
      draw("home");
      return;
    }
    var button = event.submitter;
    var choice = button ? button.value : "";
    var day = today();
    if (kind === "learn") {
      var word = quest.currentWord(state, words, day);
      if (!word) return draw("home");
      if (choice !== word.meaning) {
        wrong = true;
        note = { kind: "bad", text: "Not quite. Peek at the meaning, then try again." };
        draw("learn");
        var shaken = document.querySelector('button.choice[value="' + choice.replace(/"/g, '\\"') + '"]');
        if (shaken) shaken.classList.add("shake");
        return;
      }
      var result = quest.markCorrect(state, words, word.text, day);
      var point = button.getBoundingClientRect();
      note = { kind: "good", text: "Yes! “" + word.text + "” is yours." };
      if (result.kind === "up" && result.word) {
        var meta = levelMeta(result.word.level);
        note = { kind: "level", text: "New level: " + meta.emoji + " " + meta.name + ". " + meta.blurb };
      }
      if (quest.quizDue(state)) note = { kind: "level", text: "You have learned " + state.learned.length + " words. Quiz time!" };
      else if (quest.wordsFinished(state, day)) note = { kind: "good", text: "Those ten are done. Keep playing for the next ten." };
      if (result.fresh) giveSparkie(point.left + point.width / 2, point.top + point.height / 2);
      save();
      setTimeout(function () {
        draw(quest.wordsFinished(state, day) || quest.quizDue(state) ? "home" : "learn");
      }, 900);
      return;
    }
    if (kind === "quiz") {
      var index = Number(form.getAttribute("data-index"));
      var before = state.quiz.questions[index];
      var correct = before && !before.selected && choice === before.correct;
      quest.answerQuiz(state, index, choice, day);
      if (correct && button) {
        var rect = button.getBoundingClientRect();
        giveSparkie(rect.left + rect.width / 2, rect.top + rect.height / 2);
      }
      save();
      setTimeout(function () {
        draw(state.quiz && state.quiz.done ? "result" : "quiz");
      }, correct ? 900 : 0);
    }
  });

  document.body.addEventListener("input", function (event) {
    if (event.target.id !== "filter") return;
    var query = event.target.value.trim().toLowerCase();
    document.querySelectorAll("[data-word]").forEach(function (item) {
      var hay = (item.getAttribute("data-word") || "") + " " + (item.getAttribute("data-meaning") || "");
      item.hidden = query.length > 0 && hay.indexOf(query) === -1;
    });
  });

  draw(state.name ? "home" : "welcome");
})();
</script>
</body>
</html>
