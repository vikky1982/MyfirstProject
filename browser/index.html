<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Quest</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='34' r='22' fill='%23f0b429'/%3E%3Ccircle cx='22' cy='32' r='9' fill='%23fffdf8'/%3E%3Ccircle cx='42' cy='32' r='9' fill='%23fffdf8'/%3E%3Ccircle cx='23' cy='33' r='3.2' fill='%23243022'/%3E%3Ccircle cx='43' cy='33' r='3.2' fill='%23243022'/%3E%3Cpath d='M29 43h6l-3 6z' fill='%23e36a45'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="sparkles" class="sparkle-layer" aria-hidden="true"></div>
  <a class="skip" href="#app">Skip to the words</a>
  <header class="top">
    <button class="brand" type="button" data-go="home">
      <svg class="owl" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="34" r="22" fill="#f0b429"/>
        <circle cx="22" cy="32" r="9" fill="#fffdf8"/>
        <circle cx="42" cy="32" r="9" fill="#fffdf8"/>
        <circle cx="23" cy="33" r="3.2" fill="#243022"/>
        <circle cx="43" cy="33" r="3.2" fill="#243022"/>
        <path d="M29 43h6l-3 6z" fill="#e36a45"/>
        <path d="M14 24c4-10 12-14 18-14s14 4 18 14" fill="none" stroke="#243022" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>Word Quest</span>
    </button>
    <nav id="nav" class="nav" hidden aria-label="Pages"></nav>
    <div class="timer" id="timer" hidden>
      <div class="timer-top"><span>Time left</span><strong data-clock>15:00</strong></div>
      <div class="track" aria-hidden="true"><div class="bar" data-bar></div></div>
    </div>
  </header>
  <main id="app"></main>
  <footer class="foot">
    <p>10 new words a day · a quiz every 30 · 15 minutes, then rest</p>
    <p id="who"></p>
  </footer>
  <script src="words.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
